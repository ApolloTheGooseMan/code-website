<!doctype html>
<html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Code Helper Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="Styles.css">
</head>

<body>
    <h1 class="titles">Code Helper</h1>

    <hr />

    <div class="container cont-border p-4 rounded">

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Project Name</label>
            </div>
            <div class='col-md-10'>
                <input id='name' class="numInput" type='text' />
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Promt</label>
            </div>
            <div class='col-md-10'>
                <input id='promt' class="numInput" type='text' />
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Code Type</label>
            </div>
            <div class='col-md-10'>
                <input id='code' class="numInput" type='text' />
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Answer</label>
            </div>
            <div class='col-md-10'>
                <input id='answer' class="numInput" type='text' />
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Script</label>
            </div>
            <div class='col-md-10'>
                <input id='script' class="numInput" type='text' />
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-12'>
                <button id='search' class="enter-btn">Search for Data</button>
            </div>
        </div>
        <a href="insert.html">+ Add New Entry</a>
    </div>

    <hr />

    <div id='classes' class='cont-border p-3 m-4 overflow'>
        Data goes here.
    </div>


    <script>
        const isEmpty = (obj) => Object.keys(obj).length === 0;

        document.getElementById('search').addEventListener('click', (event) => {
            const getParameters = {};

            // if (document.querySelector('#gimm:checked')) {
            //     getParameters.gimm = 0;
            // }
            if (document.getElementById('name').value.length !== 0) {
                getParameters.name = document.getElementById('name').value;
            }
            if (document.getElementById('promt').value.length !== 0) {
                getParameters.promt = document.getElementById('promt').value;
            }
            if (document.getElementById('code').value.length !== 0) {
                getParameters.code = document.getElementById('code').value;
            }
            if (document.getElementById('answer').value.length !== 0) {
                getParameters.answer = document.getElementById('answer').value;
            }
            if (document.getElementById('script').value.length !== 0) {
                getParameters.script = document.getElementById('script').value;
            }
            // if (document.getElementById('level').value.length !== 0) {
            //     getParameters.level = document.getElementById('level').value;
            // }
            // if (document.getElementById('sort').value.length !== 0) {
            //     getParameters.sort = document.getElementById('sort').value;
            // }

            function deleteEntry(id) {

                if (!confirm("Are you sure you want to delete this entry?")) {
                    return;
                }

                fetch("/chelper/" + id, {
                    method: "DELETE"
                })
                    .then(res => res.json())
                    .then(data => {
                        alert("Deleted successfully!");

                        // re-runs the search button automatically
                        document.getElementById("search").click();
                    })
                    .catch(err => console.error(err));
            }

            //Settings for FETCH API request
            let fetchSettings = {
                method: 'GET'
            };

            //Send FETCH API request
            fetch("/chelper/" + (!isEmpty(getParameters) ? '?' + new URLSearchParams(getParameters) : ''), fetchSettings)
                .then((response) => {
                    return new Promise((resolve) => response.json()
                        .then((json) => resolve({
                            status: response.status,
                            json,
                        })
                        ));
                })
                //Logic to display errors on form 
                .then(({ status, json }) => {
                    if (status === 200) {
                        let displayTable = '<table>' +
                            '<thead>' +
                            '<tr>' +
                            '<th class="project-col">Project</th>' +
                            '<th class="prompt-col">Promt</th>' +
                            '<th class="code-col">Code Type</th>' +
                            '<th class="answer-col">Answer</th>' +
                            '<th class="script-col">Script</th>' +
                            '<th class="edit-col">Edit</th>' +
                            '</tr>' +
                            '</thead>' +
                            '<tbody>';
                        if (typeof json.data !== 'undefined') {
                            for (row of json.data) {
                                displayTable += '<tr>' +
                                    '<td>' + row.project_name + '</td>' +
                                    '<td>' + row.promt + '</td>' +
                                    '<td>' + row.code_type + '</td>' +
                                    '<td>' + row.answer + '</td>' +
                                    '<td><pre>' +
                                    row.script
                                        .replace(/</g, '&lt;')
                                        .replace(/>/g, '&gt;') +
                                    '</pre></td>' +
                                    '<td>' +
                                        '<div class="edit-cell">' +
                                    '<a class="edit-link" href="edit.html?id=' + row.id + '">Edit</a>' +
                                    '<button class="delete-btn" onclick="deleteEntry(' + row.id + ')">' +
                                    'Delete' +
                                    '</button>' +
                                    '</td>' + '</tr>';
                            }
                        }
                        displayTable += '</tbody></table>';
                        document.getElementById('classes').innerHTML = displayTable;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });

        });               
    </script>
</body>

</html>
